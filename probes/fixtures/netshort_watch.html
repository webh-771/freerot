            <script>
                const videoPlayer = document.getElementById('player');
                const videoContainer = document.getElementById('video-container');
                const currentEp = 1;
                const totalEp = 30;
                const dramaId = "2101848053751341058";
                const currentServer = 1;
                const netshortLangs = {"en":"English","in":"Indonesia","th":"Thai","ms":"Melayu","pt":"Portuguese","es":"Spanish","fr":"French","de":"German","it":"Italian","tr":"Turkish","ar":"Arabic","ja":"Japanese","ko":"Korean","zh_CN":"Chinese (Simp)","zh_TW":"Chinese (Trad)"};
                const watchActionEndpoints = ["https:\/\/cdn-netshort.dramafren.org\/index.php","https:\/\/cdn-netshortv2.dramafren.org\/index.php"];
                const videoStatus = document.getElementById('video-status');
                let availableQualities = [];
                let nextEpisodePreload = null;
                let preloadedNextEp = null;
                const nextPreloadTtlMs = 60 * 1000;
                const watchActionTimeoutMs = 12 * 1000;
                let activeWatchActionEndpoint = Array.isArray(watchActionEndpoints) && watchActionEndpoints.length
                    ? watchActionEndpoints[0]
                    : 'index.php';

                function preloadCacheKey(epNo) {
                    return `ns_preloaded_watch_${dramaId}_${epNo}_${currentServer}`;
                }

                function readPreloadedPayload(epNo) {
                    try {
                        const raw = sessionStorage.getItem(preloadCacheKey(epNo));
                        if (!raw) return null;

                        const cached = JSON.parse(raw);
                        if (!cached || !cached.payload || !cached.payload.videoUrl || Date.now() - cached.savedAt > nextPreloadTtlMs) {
                            sessionStorage.removeItem(preloadCacheKey(epNo));
                            return null;
                        }

                        sessionStorage.removeItem(preloadCacheKey(epNo));
                        return cached.payload;
                    } catch (error) {
                        sessionStorage.removeItem(preloadCacheKey(epNo));
                        return null;
                    }
                }

                function savePreloadedPayload(epNo, payload) {
                    try {
                        sessionStorage.setItem(preloadCacheKey(epNo), JSON.stringify({
                            savedAt: Date.now(),
                            payload
                        }));
                    } catch (error) {
                        console.log('Preload payload storage skipped:', error.message || error);
                    }
                }

                function setVideoStatus(message, isError = false) {
                    if (!videoStatus) return;
                    videoStatus.textContent = message || '';
                    videoStatus.classList.toggle('hidden', !message);
                    videoStatus.classList.toggle('text-red-500', isError);
                    videoStatus.classList.toggle('text-slate-300', !isError);
                }

                function getWatchActionEndpoints() {
                    const endpoints = (Array.isArray(watchActionEndpoints) ? watchActionEndpoints : [watchActionEndpoints])
                        .filter(Boolean)
                        .filter((endpoint, index, list) => list.indexOf(endpoint) === index);

                    if (endpoints.length === 0) {
                        return ['index.php'];
                    }

                    try {
                        const savedEndpoint = sessionStorage.getItem('ns_watch_action_endpoint');
                        if (savedEndpoint && endpoints.includes(savedEndpoint)) {
                            return [savedEndpoint, ...endpoints.filter(endpoint => endpoint !== savedEndpoint)];
                        }
                    } catch (error) {
                        console.log('Endpoint preference skipped:', error.message || error);
                    }

                    if (endpoints.length === 1) {
                        return endpoints;
                    }

                    const startIndex = Math.floor(Math.random() * endpoints.length);
                    return endpoints.slice(startIndex).concat(endpoints.slice(0, startIndex));
                }

                function rememberWatchActionEndpoint(endpoint) {
                    activeWatchActionEndpoint = endpoint || 'index.php';

                    try {
                        sessionStorage.setItem('ns_watch_action_endpoint', activeWatchActionEndpoint);
                    } catch (error) {
                        console.log('Endpoint preference storage skipped:', error.message || error);
                    }
                }

                function buildActionUrl(action, params = {}, endpoint = activeWatchActionEndpoint) {
                    const url = new URL(endpoint || 'index.php', window.location.href);
                    url.searchParams.set('action', action);

                    Object.entries(params).forEach(([key, value]) => {
                        if (value !== undefined && value !== null) {
                            url.searchParams.set(key, value);
                        }
                    });

                    return url.toString();
                }

                function buildResolveUrl(epNo = currentEp, endpoint = activeWatchActionEndpoint) {
                    return buildActionUrl('resolve_watch', {
                        id: dramaId,
                        ep: epNo,
                        server: currentServer,
                        _: Date.now().toString()
                    }, endpoint);
                }

                async function fetchResolvedWatch(epNo = currentEp) {
                    let lastError = null;

                    for (const endpoint of getWatchActionEndpoints()) {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), watchActionTimeoutMs);

                        try {
                            const response = await fetch(buildResolveUrl(epNo, endpoint), {
                                cache: 'no-store',
                                signal: controller.signal
                            });
                            const payload = await response.json().catch(() => null);

                            if (!response.ok || !payload || !payload.ok || !payload.videoUrl) {
                                throw new Error((payload && payload.message) || 'Video unavailable.');
                            }

                            rememberWatchActionEndpoint(endpoint);
                            payload._watchActionEndpoint = endpoint;
                            return payload;
                        } catch (error) {
                            lastError = error;
                            console.warn('Watch endpoint failed:', endpoint, error.message || error);
                        } finally {
                            clearTimeout(timeoutId);
                        }
                    }

                    throw lastError || new Error('Video unavailable.');
                }

                function addResolvedSubtitleTracks(subtitles) {
                    videoPlayer.querySelectorAll('track').forEach(track => track.remove());

                    (subtitles || []).forEach((sub, index) => {
                        if (!sub || !sub.url) return;

                        const langCode = sub.subtitleLanguage || sub.lang || sub.language || 'English';
                        const track = document.createElement('track');
                        track.kind = 'subtitles';
                        track.label = netshortLangs[langCode] || langCode;
                        track.srclang = String(langCode).slice(0, 2).toLowerCase() || 'en';
                        track.src = buildActionUrl('proxy_sub', { url: sub.url }, activeWatchActionEndpoint);
                        track.default = index === 0;
                        videoPlayer.appendChild(track);
                    });

                    setTimeout(() => {
                        loadSavedSubtitle();
                        applyStyles();
                    }, 500);
                }

                async function loadResolvedVideo() {
                    setVideoStatus('Loading video...');

                    try {
                        let payload = readPreloadedPayload(currentEp);
                        if (!payload) {
                            payload = await fetchResolvedWatch(currentEp);
                        } else if (payload._watchActionEndpoint) {
                            rememberWatchActionEndpoint(payload._watchActionEndpoint);
                        }

                        availableQualities = Array.isArray(payload.qualities) ? payload.qualities : [];
                        if (availableQualities.length === 0) {
                            availableQualities = [{ quality: 'Default', url: payload.videoUrl }];
                        }

                        videoPlayer.querySelectorAll('source').forEach(source => source.remove());
                        videoPlayer.src = payload.videoUrl;
                        addResolvedSubtitleTracks(payload.subtitles || []);
                        videoPlayer.addEventListener('loadedmetadata', preloadNextEpisodeIfShort, { once: true });
                        videoPlayer.addEventListener('durationchange', preloadNextEpisodeIfShort);
                        videoPlayer.load();
                        setVideoStatus('');
                    } catch (error) {
                        console.error(error);
                        setVideoStatus('Video Unavailable (Select Server 2 to try fallback)', true);
                    }
                }

                async function preloadNextEpisodeIfShort() {
                    const duration = Number(videoPlayer.duration);
                    const nextEp = currentEp + 1;

                    if (!Number.isFinite(duration) || duration <= 0 || duration >= 30) return;
                    if (nextEp > totalEp || preloadedNextEp === nextEp) return;

                    preloadedNextEp = nextEp;

                    try {
                        const payload = await fetchResolvedWatch(nextEp);
                        if (!payload.videoUrl) return;

                        savePreloadedPayload(nextEp, payload);

                        if (nextEpisodePreload) {
                            nextEpisodePreload.remove();
                        }

                        nextEpisodePreload = document.createElement('video');
                        nextEpisodePreload.preload = 'auto';
                        nextEpisodePreload.muted = true;
                        nextEpisodePreload.playsInline = true;
                        nextEpisodePreload.crossOrigin = 'anonymous';
                        nextEpisodePreload.src = payload.videoUrl;
                        nextEpisodePreload.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;top:-9999px;';
                        document.body.appendChild(nextEpisodePreload);
                        nextEpisodePreload.load();
                    } catch (error) {
                        console.log('Next episode preload skipped:', error.message || error);
                    }
                }

                function loadSavedSubtitle() {
                    const savedLang = localStorage.getItem('ns_saved_sub');
                    if (savedLang) {
                        const tracks = videoPlayer.textTracks;
                        for (let i = 0; i < tracks.length; i++) {
                            if (tracks[i].label === savedLang) {
                                for(let j=0; j<tracks.length; j++) tracks[j].mode = 'hidden';
                                tracks[i].mode = 'showing';
                                return;
                            }
                        }
                    }
                }

                window.closeAllSheets = function() {
                    document.querySelectorAll('.bottom-sheet').forEach(el => el.classList.remove('active'));
                    const overlay = document.getElementById('sheet-overlay');
                    if(overlay) overlay.classList.remove('active');
                };

                function buildWatchUrl(epNo) {
                    const url = new URL('index.php', window.location.href);
                    url.searchParams.set('page', 'watch');
                    url.searchParams.set('id', dramaId);
                    url.searchParams.set('ep', epNo);
                    url.searchParams.set('server', currentServer);
                    return url.toString();
                }
                function goToNextEp() { if (currentEp < totalEp) window.location.href = buildWatchUrl(currentEp + 1); }
                function goToPrevEp() { if (currentEp > 1) window.location.href = buildWatchUrl(currentEp - 1); }
                function switchServer(serverNo) {
                    const url = new URL(window.location.href);
                    url.searchParams.set('server', serverNo);
                    window.location.href = url.toString();
                }

                function toggleRotate() {
                    videoPlayer.classList.toggle('video-horizontal');
                }

                function openServerSheet() {
                    const listContainer = document.getElementById('server-list-container');
                    listContainer.innerHTML = '';
                
                    const btn1 = document.createElement('button');
                    const isCurrent1 = currentServer === 1;
                    btn1.className = `w-full text-left px-4 py-3 rounded-lg font-semibold text-sm flex justify-between items-center ${isCurrent1 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                    btn1.innerHTML = `<span>Server 1</span> ${isCurrent1 ? '<span class="text-xs">&check; Active</span>' : ''}`;
                    btn1.onclick = () => switchServer(1);
                    listContainer.appendChild(btn1);
                
                    const btn2 = document.createElement('button');
                    const isCurrent2 = currentServer === 2;
                    btn2.className = `w-full text-left px-4 py-3 rounded-lg font-semibold text-sm flex justify-between items-center ${isCurrent2 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                    btn2.innerHTML = `<span>Server 2</span> ${isCurrent2 ? '<span class="text-xs">&check; Active</span>' : ''}`;
                    btn2.onclick = () => switchServer(2);
                    listContainer.appendChild(btn2);
                
                    toggleSheet('sheet-server');
                }
                // --- GESTURE LOGIC (Tap & Swipe) ---
                let touchStartY = 0;
                let touchEndY = 0;
                let touchStartX = 0;
                  
                videoContainer.addEventListener('touchstart', e => { 
                    touchStartY = e.changedTouches[0].screenY; 
                    touchStartX = e.changedTouches[0].screenX;
                }, {passive: true});
                  
                videoContainer.addEventListener('touchend', e => {
                    touchEndY = e.changedTouches[0].screenY;
                    let touchEndX = e.changedTouches[0].screenX;
                      
                    if (document.querySelector('.bottom-sheet.active')) return; 

                    const diffY = Math.abs(touchEndY - touchStartY);
                    const diffX = Math.abs(touchEndX - touchStartX);

                    if (diffY > 50) {
                        if (touchEndY < touchStartY) goToNextEp(); else goToPrevEp();
                    } 
                }, {passive: true});

                function toggleSheet(id) {
                    window.closeAllSheets();
                    setTimeout(() => {
                        document.getElementById(id).classList.add('active');
                        document.getElementById('sheet-overlay').classList.add('active');
                    }, 50);
                }

                // --- STRATEGIC BUFFERING & STALL DETECTION ---
                let lastTime = 0;
                let stallCounter = 0;
                const checkInterval = 1000; 

                setInterval(() => {
                    if (videoPlayer && (videoPlayer.paused || videoPlayer.ended)) return;

                    if (videoPlayer && videoPlayer.currentTime === lastTime) {
                        stallCounter++;
                        if (stallCounter > 4) { 
                            console.log("Stall detected! Micro-jumping...");
                            videoPlayer.currentTime += 0.1; 
                            stallCounter = 0;
                        }
                    } else if (videoPlayer) {
                        stallCounter = 0;
                        lastTime = videoPlayer.currentTime;
                    }
                }, checkInterval);

                // --- QUALITY LOGIC ---
                function openQualitySheet() {
                    const listContainer = document.getElementById('quality-list-container');
                    listContainer.innerHTML = '';
                      
                    if (availableQualities.length === 0) {
                        listContainer.innerHTML = '<div class="text-slate-400 text-center p-4">No other qualities available</div>';
                    } else {
                        availableQualities.forEach(q => {
                            const btn = document.createElement('button');
                            const activeSrc = videoPlayer.currentSrc || videoPlayer.src || '';
                            const isCurrent = activeSrc === q.url || activeSrc.includes(q.url);
                            btn.className = `w-full text-left px-4 py-3 rounded-lg font-semibold text-sm flex justify-between items-center ${isCurrent ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                            btn.innerHTML = `<span>${q.quality}</span> ${isCurrent ? '<span></span>' : ''}`;
                            btn.onclick = () => changeQuality(q.url);
                            listContainer.appendChild(btn);
                        });
                    }
                    toggleSheet('sheet-quality');
                }

                function changeQuality(url) {
                    const activeSrc = videoPlayer.currentSrc || videoPlayer.src || '';
                    if (activeSrc === url || activeSrc.includes(url)) { window.closeAllSheets(); return; }
                      
                    const currentTime = videoPlayer.currentTime;
                    const isPaused = videoPlayer.paused;
                      
                    videoPlayer.src = url;
                    videoPlayer.currentTime = currentTime;
                      
                    if (!isPaused) {
                        const playPromise = videoPlayer.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => { console.log("Auto-play prevented"); });
                        }
                    }
                    window.closeAllSheets();
                }

                function openLangSheet() {
                    const listContainer = document.getElementById('lang-list-container');
                    listContainer.innerHTML = '';
                    const tracks = videoPlayer.textTracks;
                      
                    const btnOff = document.createElement('button');
                    btnOff.className = 'w-full text-center p-2 rounded bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs col-span-2';
                    btnOff.innerText = "Disable Subtitles";
                    btnOff.addEventListener('click', function() {
                        window.closeAllSheets();
                        for(let i=0; i<tracks.length; i++) tracks[i].mode = 'hidden';
                        localStorage.removeItem('ns_saved_sub');
                    });
                    listContainer.appendChild(btnOff);

                    for (let i = 0; i < tracks.length; i++) {
                        if (tracks[i].kind === 'subtitles') {
                            const btn = document.createElement('button');
                            const isSelected = tracks[i].mode === 'showing';
                            btn.className = `w-full text-left px-4 py-3 rounded-lg font-semibold text-sm flex items-center ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                            btn.innerText = tracks[i].label || `Track ${i}`;
                            btn.addEventListener('click', function() {
                                window.closeAllSheets(); 
                                setTimeout(() => {
                                    for(let j=0; j<tracks.length; j++) tracks[j].mode = 'hidden';
                                    tracks[i].mode = 'showing';
                                    localStorage.setItem('ns_saved_sub', tracks[i].label);
                                    applyStyles();
                                }, 100); 
                            });
                            listContainer.appendChild(btn);
                        }
                    }
                    toggleSheet('sheet-langs');
                }

                // Subtitle Styling
                const inpSize = document.getElementById('inp-size');
                const inpPos = document.getElementById('inp-pos');
                const lblSize = document.getElementById('lbl-size');
                const lblPos = document.getElementById('lbl-pos');
                const styleTag = document.getElementById('dynamic-sub-style');

                function loadSettings() {
                    const savedSize = localStorage.getItem('ns_sub_size') || '0.9';
                    const savedPos = localStorage.getItem('ns_sub_pos') || '30';
                    if (inpSize) inpSize.value = savedSize; 
                    if (inpPos) inpPos.value = savedPos; 
                    applyStyles(); 
                    loadSavedSubtitle();
                }

                // === MODIFIKASI: LOGIKA ONADDCUE AGAR TIDAK MELOMPAT & NETFLIX STYLE ===
                function applyStyles() {
                    if (!inpSize || !inpPos) return;
                    const size = inpSize.value; 
                    const liftPercent = parseInt(inpPos.value);
                    
                    lblSize.innerText = size + 'em'; 
                    lblPos.innerText = liftPercent + '%';
                    
                    localStorage.setItem('ns_sub_size', size); 
                    localStorage.setItem('ns_sub_pos', liftPercent);
                    
                    styleTag.innerHTML = `video::cue { font-size: ${size}em !important; background-color: transparent !important; color: #ffffff !important; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif !important; font-weight: bold !important; text-shadow: 0px 0px 4px rgba(0,0,0,0.8), 0px 0px 8px rgba(0,0,0,0.8), 2px 2px 3px rgba(0,0,0,0.9) !important; }`;
                    
                    if (!videoPlayer) return;
                    const tracks = videoPlayer.textTracks;
                    for (let i = 0; i < tracks.length; i++) {
                        const track = tracks[i];
                        
                        const updateCue = (cue) => { 
                            if(!cue) return; 
                            cue.snapToLines = false; 
                            cue.line = 100 - liftPercent - 5; 
                        };

                        if (track.cues) {
                            Array.from(track.cues).forEach(updateCue);
                        }

                        track.onaddcue = function(event) { 
                            updateCue(event.cue); 
                        };
                    }
                }
                // =========================================================================

                function resetSubSettings() { inpSize.value = 0.9; inpPos.value = 30; applyStyles(); }
                if (inpSize) {
                    inpSize.addEventListener('input', applyStyles); 
                    inpSize.addEventListener('change', applyStyles); 
                }
                if (inpPos) {
                    inpPos.addEventListener('input', applyStyles);
                    inpPos.addEventListener('change', applyStyles);
                }
                  
                // Init - FIX UTAMA: Panggil loadSettings langsung sebelum set auto-hide
                loadSettings(); 
                loadResolvedVideo();
                window.addEventListener('load', loadSettings);
                if(videoPlayer) videoPlayer.addEventListener('loadedmetadata', loadSettings);
                  
                if(videoPlayer) {
                    videoPlayer.addEventListener('ended', function() { 
                        // Fitur auto next dinonaktifkan agar user memegang kendali manual untuk pindah episode
                    });
                }

                const subUpload = document.getElementById('subtitle-upload');
                if(subUpload) {
                    subUpload.addEventListener('change', function(e) {
                        const file = e.target.files[0];
                        if (file) {
                            const track = document.createElement('track');
                            track.kind = 'subtitles'; track.src = URL.createObjectURL(file); track.default = true; track.label = "Custom Upload";
                            videoPlayer.appendChild(track);
                            setTimeout(() => { for(let i=0; i<videoPlayer.textTracks.length; i++) videoPlayer.textTracks[i].mode = 'hidden'; videoPlayer.textTracks[videoPlayer.textTracks.length-1].mode = 'showing'; applyStyles(); }, 500);
                        }
                    });
                }

                // ==========================================
                // FITUR BARU: AUTO-HIDE UI (TIDAK ADA INTERAKSI)
                // ==========================================
                let idleTimer;
                const idleTime = 3000; // Hilang otomatis setelah 3 detik
                const uiElements = document.querySelectorAll('.tk-overlay-top, .tk-overlay-right, .tk-overlay-bottom');

                function hideUI() {
                    if (document.querySelector('.bottom-sheet.active')) return;
                    if (!videoPlayer || videoPlayer.paused) return;

                    uiElements.forEach(el => el.classList.add('ui-hidden'));
                    if (videoContainer) videoContainer.classList.add('hide-cursor');
                    
                    // Panggil ulang applyStyles() untuk mengunci subtitle agar tidak di-reset oleh browser
                    applyStyles();
                }

                function resetIdleTimer() {
                    uiElements.forEach(el => el.classList.remove('ui-hidden'));
                    if (videoContainer) videoContainer.classList.remove('hide-cursor');
                    
                    // Panggil ulang applyStyles() untuk mengunci subtitle
                    applyStyles();
                    
                    clearTimeout(idleTimer);
                    idleTimer = setTimeout(hideUI, idleTime);
                }

                ['mousemove', 'mousedown', 'touchstart', 'touchmove', 'click', 'keydown'].forEach(evt => {
                    window.addEventListener(evt, resetIdleTimer, {passive: true});
                });

                resetIdleTimer();
            </script>
            </div>
